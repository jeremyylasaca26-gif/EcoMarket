<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Frutiver Market</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <header>
        <h1>Contacto</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="carrito.html">Carrito</a>
        </nav>
    </header>

    <main>
        <section class="tarjeta section">
            <h2>¿Tienes dudas o quieres hacer un pedido especial?</h2>
            <p>Rellena el siguiente formulario y nos pondremos en contacto contigo lo antes posible.</p>

            <form class="formulario-contacto">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Jeremy Ylasaca Lipa">

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" required placeholder="Ej: 3001234567">

                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required placeholder="1642035@senati.pe">

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

                <button type="submit" class="boton">Enviar mensaje</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        © 2025 Eco Market. Todos los derechos reservados.
    </footer>
</body>

</html>
